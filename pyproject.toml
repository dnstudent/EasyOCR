[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easyocr"
version = "1.7.3"
description = "End-to-End Multi-Lingual Optical Character Recognition (OCR) Solution"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rakpong Kittinaradorn", email = "r.kittinaradorn@gmail.com" },
]
keywords = ["ocr", "optical character recognition", "deep learning", "neural network"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyclipper>=1.4.0",
    "python-bidi>=0.6.11",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
easyocr = "easyocr.cli:main"

[project.urls]
Homepage = "https://github.com/dnstudent/EasyOCR"
Repository = "https://github.com/dnstudent/EasyOCR.git"

[project.optional-dependencies]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.7.2",
]
dbnet-dcn = [
    "ninja>=1.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["easyocr"]

[tool.hatch.build.targets.sdist]
include = ["easyocr", "LICENSE", "README.md"]

[dependency-groups]
craft = [
    "ipdb>=0.13.13",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]
dev = [
    "basedpyright>=1.40.2",
    "ipykernel>=7.4.0",
    "ruff>=0.17.1,<0.18",
]
trainer = [
    "natsort>=8.4.0",
    "nltk>=3.10.3",
    "pandas>=2.3.3",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["dist"]

[tool.basedpyright]
include = ["easyocr", "trainer", "unit_test"]
exclude = ["**/__pycache__", "**/*.ipynb"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
# Keep the Unknown/Any radar on as warnings: these measure the annotation
# campaign. Explicit `Any` is allowed where a type is genuinely dynamic.
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportUnannotatedClassAttribute = "warning"
reportAny = "none"
reportExplicitAny = "none"

# trainer/ stays script-only: its modules import each other script-style,
# which only resolves when running from inside the script's own directory.
[[tool.basedpyright.executionEnvironments]]
root = "trainer/craft"
reportImplicitRelativeImport = "none"

[[tool.basedpyright.executionEnvironments]]
root = "trainer"
reportImplicitRelativeImport = "none"
